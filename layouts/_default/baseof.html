<!doctype html>
<html lang="{{ site.LanguageCode }}">
{{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell{{ if and (eq .Section "collections") .IsPage }} site-shell--wide{{ end }}">
    {{ partial "header.html" . }}
    <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
