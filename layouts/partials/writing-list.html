{{ if . }}
<ul class="writing-list">
  {{ range . }}
  <li>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <time class="meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ else }}
<p class="empty-state">Nothing published here yet. Notes are on their way.</p>
{{ end }}
